<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FleetDocs</title>

<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/app.css"> 

<style>
body{
    font-family: "Segoe UI", sans-serif;
}

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    padding:40px 30px;
    background:var(--color-panel);
    border:1px solid var(--color-panel-border);
    border-radius:28px;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow-card);
    text-align:center;
}

.logo-wrapper{
    margin-bottom:24px;
}

/* NEW: fingerprint as button */
.fingerprint-btn{
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
}

.fingerprint{
    width:110px; /* a bit smaller than before (was 140px on logo-wrapper img) */
    max-width:100%;
    filter:
        drop-shadow(0 0 12px rgba(96,165,250,.30))
        drop-shadow(0 0 30px rgba(96,165,250,.20));
    animation:pulse 2.5s infinite;
    transition:transform .2s ease, filter .2s ease;
}

.fingerprint-btn:hover .fingerprint{
    transform:scale(1.05);
    filter:
        drop-shadow(0 0 16px rgba(96,165,250,.40))
        drop-shadow(0 0 34px rgba(96,165,250,.24));
}

.fingerprint-btn:active .fingerprint{
    transform:scale(0.98);
}

@keyframes pulse {
    0%{ transform:scale(1); }
    50%{ transform:scale(1.05); }
    100%{ transform:scale(1); }
}

.app-title{
    color:var(--color-title);
    font-size:32px;
    font-weight:700;
    margin-bottom:10px;
}

.app-subtitle{
    color:var(--color-text);
    font-size:15px;
    line-height:1.5;
    margin-bottom:35px;
}

.features{
    margin-bottom:30px;
    text-align:left;
}

/* Keep feature rows, remove icon layout dependency */
.feature{
    margin-bottom:14px;
    color:var(--color-text);
    font-size:14px;
}

/* Icons removed from layout */
.feature-icon{
    display:none;
}

.version{
    margin-top:24px;
    color:var(--color-text);
    font-size:12px;
}

.footer-text{
    margin-top:10px;
    color:var(--color-icon-muted);
    font-size:12px;
}
</style>

</head>

<body>

<div class="login-container">
    <div class="login-card">

       
        <p class="app-subtitle">
            Vehicle Document Management
            Store, organize, and monitor all your vehicle documentation with automated expiration alerts and secure digital access.
        </p>

 <div class="logo-wrapper">
            <button class="fingerprint-btn" onclick="ingresar()" aria-label="Ingresar">
                <img
                    src="images/huella_blanco.png"
                    alt="Huella Digital"
                    class="fingerprint">
            </button>
        </div>

 <div class="version">
            Tap fingerprint to continue
        </div>

        
        <!-- Removed old INGRESAR button -->

        <div class="version">
            FleetDocs V1.0
        </div>

       

    </div>
</div>

<script>
function ingresar(){
    window.location.href="dashboard.html";
}
</script>

</body>
</html>
