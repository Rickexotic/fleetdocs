<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

    <title>FleetDocs</title>

    <!-- PWA -->
    <meta name="theme-color" content="#050816">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FleetDocs">

    <link rel="manifest" href="./manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="./css/main.css?v=3">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- App title -->
            <h1 class="app-title">
                FleetDocs
            </h1>

            <!-- App description -->
            <div class="subtitle-container">
                <p
                    id="subtitle"
                    class="app-subtitle">
                    Store, organize and monitor all your vehicle documents with automated expiration alerts and secure digital access.
                </p>
            </div>

            <!-- Fingerprint -->
            <div class="logo-wrapper">

                <button
                    class="fingerprint-btn"
                    onclick="ingresar()"
                    aria-label="Login">

                    <img src="./images/huella_blanco.png" alt="Fingerprint" class="fingerprint">

                </button>

            </div>

            <p
                id="touchText"
                class="touch-text">
                Fingerprint to continue
            </p>

            <!-- Language selector -->
            <div class="language-switch">

                <button
                    id="btn-en"
                    class="language-btn active"
                    onclick="setLanguage('en')">
                    EN
                </button>

                <button
                    id="btn-es"
                    class="language-btn"
                    onclick="setLanguage('es')">
                    ES
                </button>

            </div>

        </div>

    </div>

    <script>

        const texts = {

            en: {

                subtitle:
                    "Store, organize and monitor all your vehicle documents with automated expiration alerts and secure digital access.",

                touch:
                    "Fingerprint to continue"

            },

            es: {

                subtitle:
                    "Almacena, organiza y controla toda la documentación de tus vehículos con alertas automáticas de vencimiento y acceso digital seguro.",

                touch:
                    "Huella para continuar"

            }

        };

        function setLanguage(lang){

            document.getElementById("subtitle").textContent =
                texts[lang].subtitle;

            document.getElementById("touchText").textContent =
                texts[lang].touch;

            document.documentElement.lang = lang;

            document
                .getElementById("btn-en")
                .classList.remove("active");

            document
                .getElementById("btn-es")
                .classList.remove("active");

            document
                .getElementById("btn-" + lang)
                .classList.add("active");

            localStorage.setItem(
                "fleetdocs-language",
                lang
            );
        }

        const savedLanguage =
            localStorage.getItem(
                "fleetdocs-language"
            ) || "en";

        setLanguage(savedLanguage);

        function ingresar(){

            window.location.href =
                "dashboard.html";

        }

        if("serviceWorker" in navigator){

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(() => {

                            console.log(
                                "Service Worker registered"
                            );

                        })
                        .catch(error => {

                            console.error(
                                "Service Worker error:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
